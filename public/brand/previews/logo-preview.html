<!DOCTYPE html>
<html>
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { background: #0B0B0D; color: #F2EDE3; padding: 40px; font-family: sans-serif; }
  .gold { color: #C8A45C; }
  .logo-wrap {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    text-decoration: none;
  }
  .mark-svg {
    width: 52px;
    height: 52px;
    color: #C8A45C;
    flex-shrink: 0;
  }
  .text-lockup {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .top-the {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.28em;
    color: #C8A45C;
    line-height: 1;
    margin-bottom: 3px;
  }
  .the-line {
    width: 22px;
    height: 1px;
    background-color: #C8A45C;
    opacity: 0.8;
  }
  .main-brand {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: #C8A45C;
    line-height: 0.95;
  }
</style>
</head>
<body>
  <div class="logo-wrap">
    <svg viewBox="0 0 100 100" class="mark-svg">
      <!-- Outer circle -->
      <circle cx="50" cy="50" r="47" fill="none" stroke="currentColor" stroke-width="1.3" />
      <!-- Inner circle -->
      <circle cx="50" cy="50" r="41" fill="none" stroke="currentColor" stroke-width="0.9" />
      
      <!-- 12 dots -->
      <circle cx="94.0" cy="50.0" r="1.3" fill="currentColor" />
      <circle cx="88.1" cy="72.0" r="1.3" fill="currentColor" />
      <circle cx="72.0" cy="88.1" r="1.3" fill="currentColor" />
      <circle cx="50.0" cy="94.0" r="1.3" fill="currentColor" />
      <circle cx="28.0" cy="88.1" r="1.3" fill="currentColor" />
      <circle cx="11.9" cy="72.0" r="1.3" fill="currentColor" />
      <circle cx="6.0" cy="50.0" r="1.3" fill="currentColor" />
      <circle cx="11.9" cy="28.0" r="1.3" fill="currentColor" />
      <circle cx="28.0" cy="11.9" r="1.3" fill="currentColor" />
      <circle cx="50.0" cy="6.0" r="1.3" fill="currentColor" />
      <circle cx="72.0" cy="11.9" r="1.3" fill="currentColor" />
      <circle cx="88.1" cy="28.0" r="1.3" fill="currentColor" />

      <!-- Fine crosshairs -->
      <line x1="50" y1="5" x2="50" y2="95" stroke="currentColor" stroke-width="0.7" opacity="0.45" />
      <line x1="5" y1="50" x2="95" y2="50" stroke="currentColor" stroke-width="0.7" opacity="0.45" />
      
      <!-- 4 diagonal rays -->
      <g stroke="none" fill="currentColor">
        <polygon points="50,50 48,39 50,23 52,39" transform="rotate(45 50 50)" />
        <polygon points="50,50 48,39 50,23 52,39" transform="rotate(135 50 50)" />
        <polygon points="50,50 48,39 50,23 52,39" transform="rotate(225 50 50)" />
        <polygon points="50,50 48,39 50,23 52,39" transform="rotate(315 50 50)" />
      </g>
      
      <!-- Primary 4-point elongated star -->
      <path d="M 50,13 Q 50,42 83,50 Q 50,58 50,87 Q 50,58 17,50 Q 50,42 50,13 Z" fill="currentColor" stroke="none" />
      
      <!-- Center pivot dot -->
      <circle cx="50" cy="50" r="2.8" fill="#0B0B0D" stroke="none" />
    </svg>

    <div class="text-lockup">
      <div class="top-the">
        <span class="the-line"></span>
        <span>THE</span>
      </div>
      <div class="main-brand">AI BOOTCAMP</div>
    </div>
  </div>
</body>
</html>
